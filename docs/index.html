<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — consultant prototype</title>
<style>
:root{
  --nav:#120d2e;--nav2:#0e1430;--admin:#080d1c;--studio-top:#0d1c40;--studio-bot:#1b3b66;
  --card:#101a33;--card-2:#0b1326;--line:#22304f;--line-2:#182340;
  --ink:#e7ecf7;--muted:#95a4c4;--dim:#647391;
  --blue:#3f8fe0;--blue-lt:#7fc9f2;--purple:#c084fc;
  --green:#2fbf71;--amber:#d1a03a;--red:#f2696b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:#05080f;color:var(--ink);font:14px/1.6 -apple-system,"Helvetica Neue",Arial,system-ui,sans-serif}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue-lt)}

/* ── harness banner ── */
.harness{background:#0a1224;border-bottom:1px solid var(--line-2);padding:7px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.harness b{color:#fff}
.harness .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.harness select{background:#0f1830;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:4px 9px;font-size:11.5px}
.harness .rs{display:inline-flex;background:#0c1528;border:1px solid var(--line-2);border-radius:99px;padding:3px}
.harness .rs button{background:none;border:0;color:var(--muted);padding:4px 12px;border-radius:99px;font-size:11px}
.harness .rs button.on{background:var(--blue);color:#fff;font-weight:600}
.project-picks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.project-pick{display:flex;align-items:center;gap:8px;background:#0a1224;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--muted);cursor:pointer}
.project-pick.on{border-color:var(--blue);color:#fff;background:#11203d}
.project-pick input{accent-color:var(--blue)}
.project-pick small{color:var(--dim);margin-left:auto}

/* ── product chrome ── */
.dqnav{background:var(--nav);padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dqlogo{font-weight:800;letter-spacing:.05em;font-size:13px;line-height:1.1;white-space:nowrap}
.dqlogo small{display:block;font-size:6px;color:var(--muted);letter-spacing:.16em;font-weight:500}
.dqtabs{display:flex;gap:2px;flex-wrap:wrap;margin:auto}
.dqtabs span{color:#c2cfe8;padding:5px 10px;border-radius:99px;font-size:11.5px;white-space:nowrap}
.dqtabs span.on{background:var(--blue);color:#fff;font-weight:600}
.dqr{font-size:11px;color:var(--muted);display:flex;gap:9px;align-items:center}
.pchip{background:#16223f;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:10.5px;color:#cfe0ff}
.searchbar{background:#0d1530;border:1px solid var(--line-2);border-radius:99px;padding:7px 15px;color:var(--dim);font-size:11.5px;max-width:420px;margin:10px auto 0;display:flex;justify-content:space-between}
.crumb{background:var(--nav2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:8px 18px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted)}
.crumb .bdg{border:1px solid rgba(242,105,107,.55);color:#f6a1a2;border-radius:99px;padding:1px 8px;font-size:8.5px;font-weight:800;letter-spacing:.08em}
.crumb b{color:#fff;font-weight:600}
.crumb .bk{margin-left:auto}
.crumb .lk{color:var(--blue-lt);cursor:pointer}

.body{background:var(--admin);padding:20px 22px 40px;min-height:calc(100vh - 150px);position:relative}
.body.studio{background:linear-gradient(170deg,var(--studio-top),var(--studio-bot)) , var(--admin);background-repeat:no-repeat;background-size:100% 340px}
.inner{max-width:1180px;margin:auto;position:relative}
.globe{position:absolute;right:0;top:-6px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,rgba(216,180,254,.45),rgba(168,85,247,.24) 42%,rgba(88,28,135,.14) 70%,transparent 74%);
  border:1px solid rgba(192,132,252,.14);pointer-events:none}
.globe::after{content:"";position:absolute;inset:14%;border-radius:50%;border:1px solid rgba(192,132,252,.12);
  background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(216,180,254,.055) 13px 14px),
             repeating-linear-gradient(0deg,transparent 0 13px,rgba(216,180,254,.055) 13px 14px)}
@media(max-width:900px){.globe{display:none}}

h1.pt{font-size:22px;font-weight:700;margin:0 0 6px;letter-spacing:-.015em}
h1.pt.sm{font-size:19px}
.plead{color:#a4b6d8;font-size:12.5px;margin:0 0 18px;max-width:520px}
.rowtop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}

.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:11px;margin:0 0 16px;max-width:620px;align-items:center}
.meta .k{color:var(--dim);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.st{display:inline-block;padding:2px 9px;border-radius:5px;font-size:10.5px;font-weight:700}
.st.draft{background:#1b2540;color:#9fb0d0}
.st.amb{background:rgba(209,160,58,.16);color:#e3bf72}
.st.live{background:rgba(47,191,113,.18);color:#6ee7a8}
.st.retr{background:rgba(242,105,107,.16);color:#f6a1a2}
.st.pj{background:rgba(63,143,224,.2);color:#9ecbf5}
.st.amb{background:rgba(209,160,58,.16);color:#e3bf72}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;white-space:nowrap}
.btn.pill{border-radius:99px}
.btn.lt{background:var(--blue-lt);color:#08203a}
.btn.gh{background:#141f3c;border:1px solid var(--line);color:#cfe0ff;font-weight:500}
.btn.dn{background:#151e36;color:#68789a;border:1px solid var(--line-2);cursor:not-allowed}
.btn.ok{background:var(--green);color:#03240f}
.btn.warn{background:rgba(209,160,58,.18);border:1px solid rgba(209,160,58,.5);color:#e3bf72;font-weight:600}
.btn.dgr{background:rgba(242,105,107,.16);border:1px solid rgba(242,105,107,.45);color:#f6a1a2;font-weight:600}
.btn.sm{padding:5px 11px;font-size:11px}
.btn.w{width:100%;justify-content:center}
.btn.txt{background:none;border:0;color:var(--muted);padding:8px 6px;font-weight:500}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;max-width:860px}
.tile{background:rgba(14,25,50,.86);border:1px solid var(--line);border-radius:12px;padding:15px;cursor:pointer;transition:.13s}
.tile:hover{border-color:rgba(63,143,224,.55);transform:translateY(-1px)}
.tile.dash{border-style:dashed;opacity:.66}
.tile .ic{width:27px;height:27px;border-radius:7px;background:#16223f;display:grid;place-items:center;font-size:12px;margin-bottom:10px}
.tile .nm{font-weight:650;font-size:14.5px;margin-bottom:3px}
.tile .ds{color:var(--dim);font-size:11.5px;margin-bottom:12px;min-height:32px}
.tile .ft{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.05em}
.tile .ft .ar{color:var(--muted);font-weight:400}
.gr{color:var(--green)}.am{color:var(--amber)}.rd{color:var(--red)}

.empty{border:1px dashed var(--line);border-radius:12px;padding:38px 22px;text-align:center;background:rgba(10,18,38,.55);max-width:860px}
.empty .e1{font-size:13px;color:#93a6c8;margin-bottom:5px}
.empty .e2{font-size:11.5px;color:var(--dim);margin-bottom:16px}

.two{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.vitem{background:#0c1528;border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;font-size:11.5px;margin-bottom:8px;cursor:pointer}
.vitem:hover{border-color:var(--line)}
.vitem.on{border-color:var(--blue);background:#11203d}
.vitem .vn{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:7px;align-items:center}
.vitem .vd{color:var(--dim);font-size:10px;margin-top:3px}

.vpanel{background:#0a1224;border:1px solid var(--line-2);border-radius:11px;padding:15px}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:11px}
.note{font-size:11px;color:var(--dim);margin:0 0 11px}
.srcwrap{border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:#060c1a}
.srchd{padding:7px 12px;font-size:10.5px;color:var(--dim);border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0a1020}
pre.src{margin:0;padding:11px 13px;font:10.5px/1.62 var(--mono);color:#8fa3c8;max-height:230px;overflow:auto;white-space:pre}
.rdonly{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10.5px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
.rdonly b{color:#fff}

.lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.frame{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0b1120}
.frhd{background:#0c1528;padding:7px 12px;font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-2);align-items:center;flex-wrap:wrap}
.frhd b{color:#fff}
iframe.pv{width:100%;border:0;display:block;background:#0f0a1f}
iframe.pv.tall{height:640px}
iframe.pv.mid{height:400px}

.fileline{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--line-2);color:var(--muted)}
.fileline:last-child{border-bottom:0}
.fileline b{color:#e7ecf7;font-weight:600}
.flist{max-height:150px;overflow:auto}

/* overview page */
.lp{background:rgba(9,17,36,.75);border:1px solid var(--line);border-radius:12px;padding:17px;max-width:660px}
.blk{border:1px dashed var(--line);border-radius:9px;padding:11px 13px;margin-bottom:9px;font-size:12px;color:var(--muted);position:relative}
.blk .bl{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.blk.lock{border-style:solid;background:#0a1224}
.blk h5{margin:0 0 3px;font-size:16px;color:#fff}
.blk textarea{width:100%;background:#0d1730;border:1px solid var(--line-2);color:var(--ink);border-radius:7px;padding:9px 11px;font-size:12px;resize:vertical;min-height:70px}
.blk textarea:focus{outline:0;border-color:var(--blue)}

/* client overview render */
.cov{max-width:720px;margin:auto}
.cov .kick{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);margin-bottom:8px}
.cov h2{margin:0 0 5px;font-size:23px;letter-spacing:-.015em}
.cov .cd{color:var(--muted);font-size:13px;margin-bottom:20px}
.cov .sec{border-top:1px solid var(--line-2);padding-top:14px;margin-top:14px}
.cov .sl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.cov .sv{font-size:12.5px;color:var(--muted)}
.cov .sv b{color:#fff}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(3,6,14,.78);display:grid;place-items:center;padding:20px;z-index:50;overflow:auto}
.modal{background:#0a1630;border:1px solid var(--line);border-radius:13px;padding:19px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,.75);margin:auto}
.modal.wide{max-width:660px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.mh b{font-size:16px}.mh .x{color:var(--dim);cursor:pointer;font-size:17px;line-height:1}
.md{font-size:11.5px;color:var(--dim);margin-bottom:15px;line-height:1.6}
.field{background:#0d1730;border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;margin-bottom:11px}
.field.req{border-color:rgba(63,143,224,.4)}
.field .fl{font-size:9px;color:var(--dim);margin-bottom:3px;letter-spacing:.05em}
.field input,.field textarea{width:100%;background:none;border:0;color:var(--ink);font-size:13px;padding:0}
.field input:focus,.field textarea:focus{outline:0}
.field textarea{resize:vertical;min-height:58px;font-size:12px}
.field .fv{font-size:12.5px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:5px}
.paste{width:100%;background:#0a1224;border:1px solid var(--line-2);color:#8fa3c8;border-radius:9px;padding:11px 13px;font:11px/1.6 var(--mono);min-height:130px;resize:vertical}
.paste:focus{outline:0;border-color:var(--blue)}
.upr{display:flex;gap:8px;align-items:center;margin:11px 0;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.dropzone{border:1px dashed #35507e;border-radius:10px;padding:22px;text-align:center;background:#0a1224;color:var(--muted);margin:11px 0;transition:.15s}
.dropzone.over{border-color:var(--blue-lt);background:#10213e}
.dropzone b{display:block;color:#fff;margin-bottom:3px}
.validation{border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin:10px 0;background:#0a1224}
.validation .vh{padding:8px 11px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line-2)}
.validation .vr{padding:7px 11px;font-size:11px;color:var(--muted);display:flex;gap:8px;border-bottom:1px solid var(--line-2)}
.validation .vr:last-child{border-bottom:0}.validation .ok{color:var(--green)}.validation .er{color:var(--red)}.validation .wa{color:var(--amber)}
.conseq{background:#0a1224;border:1px solid var(--line-2);border-radius:9px;padding:12px 13px;margin-bottom:12px}
.conseq div{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.conseq div:last-child{border-bottom:0}
.conseq .y{color:#6ee7a8}.conseq .a{color:#e3bf72}.conseq .w{color:#fff}

.seg{display:inline-flex;background:#0c1528;border:1px solid var(--line-2);border-radius:99px;padding:3px}
.seg button{background:none;border:0;color:var(--muted);padding:5px 14px;border-radius:99px;font-size:11.5px;white-space:nowrap}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.pipe{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.pipe .n2{padding:5px 12px;border-radius:7px;border:1px solid var(--line-2);background:#0c1528;font-size:11.5px;color:var(--muted);white-space:nowrap}
.pipe .n2.on{border-color:var(--blue);background:#11203d;color:#fff;font-weight:600}
.pipe .n2.done{border-color:rgba(47,191,113,.4)}
.pipe .n2.term{border-color:rgba(242,105,107,.4);color:#f6a1a2}
.pipe .ar{color:var(--dim)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#10233f;border:1px solid rgba(63,143,224,.5);color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.hintbar{background:rgba(63,143,224,.09);border:1px solid rgba(63,143,224,.28);border-radius:10px;padding:10px 13px;font-size:11.5px;color:var(--muted);margin-bottom:16px}
.hintbar b{color:#fff}
.wd{max-width:520px;margin:60px auto;text-align:center}
.wd .wi{font-size:30px;margin-bottom:12px}
.story{max-width:1050px;margin:auto}.story h2{margin:0 0 7px;font-size:20px}.story h3{font-size:13px;margin:22px 0 8px;color:#fff}
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.story-grid{grid-template-columns:1fr}}
.story-card{background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:14px}.story-card h4{margin:0 0 7px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.story-card p,.story-card li{color:var(--muted);font-size:12px}.story-card ul,.story-card ol{margin:6px 0 0;padding-left:18px}.story-card li{margin:5px 0}.story-card b{color:#fff}
</style>
</head>

<div class="harness">
  <span><b>Working prototype</b> — upload a real standalone HTML file and it renders for real.</span>
  <span class="sp">
    <span>Project</span>
    <select id="projSel"></select>
    <span class="rs" id="roleSw">
      <button data-role="consultant">Blue Ops consultant</button>
      <button data-role="client">Client consumer</button>
    </span>
    <button class="btn gh sm" data-act="workflow">Workflow &amp; user story</button>
    <button class="btn gh sm" data-act="reset">Reset demo</button>
  </span>
</div>

<div id="chrome"></div>
<div id="app"></div>
<div id="modalHost"></div>

<input type="file" id="fiHtml" accept=".html,.htm" hidden>

<script type="text/template" id="seedHvac">
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>HVAC Cross-Sell &amp; Wallet Share Analysis</title>
<style>
:root{--bg:#0f0a1f;--panel:#150f2c;--panel-2:#1a1338;--line:#2a1d4a;--text:#ece7f7;--muted:#a394c4;--accent:#c084fc;--accent-soft:rgba(192,132,252,.1);--green:#6ee7a8;--amber:#e3bf72;--red:#f2969b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:30px 24px 60px}
header.deliverable{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:600}
h1{margin:8px 0 6px;font-size:27px;font-weight:650;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 11px;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
@media(max-width:780px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi .label{color:var(--muted);font-size:12px}
.kpi .value{font-size:26px;font-weight:650;margin-top:6px;letter-spacing:-.02em}
.kpi .delta{font-size:12px;margin-top:4px;color:var(--muted)}
.kpi .up{color:var(--green)}.kpi .warn{color:var(--amber)}.kpi .down{color:var(--red)}
nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.tab{background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;padding:10px 15px;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
.tab:hover{color:var(--text);background:var(--panel)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);background:var(--accent-soft)}
section.panel{display:none}section.panel.active{display:block}
.headline{border-left:3px solid var(--accent);background:var(--panel-2);padding:14px 16px;border-radius:0 8px 8px 0;margin-bottom:22px}
h2{font-size:15px;margin:26px 0 12px;letter-spacing:.02em}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7dd3fc)}
ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}li{margin:6px 0}
.foot{margin-top:34px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:11.5px}
</style></head>
<body><div class="wrap">
<header class="deliverable">
  <div class="eyebrow">Atlas deliverable &middot; generated via Atlas Studio</div>
  <h1>HVAC Cross-Sell &amp; Wallet Share Analysis</h1>
  <p class="sub">Pinnacle Corp &middot; Trailing 12 months to 30 Jun 2026</p>
  <div class="meta">
    <span class="chip">Source: Lakehouse / Pinnacle Corp / Financial Reporting</span>
    <span class="chip">Template: Generic Charts</span>
    <span class="chip">Rows analysed: 48,912</span>
    <span class="chip">Illustrative sample data</span>
  </div>
</header>

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtBytes(b){ return b<1024 ? b+' B' : b<1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB'; }
function fmtDate(t){ const d=new Date(t); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function validateHtml(html, size){
  const checks = [];
  const critical = (label, detail)=>checks.push({level:'error',label,detail});
  const warn = (label, detail)=>checks.push({level:'warning',label,detail});
  const ok = (label, detail)=>checks.push({level:'ok',label,detail});
  if(!html || !html.trim()) critical('Empty file','The HTML document contains no content.');
  else if(!/<html[\s>]/i.test(html) || !/<\/html>/i.test(html)) critical('Document structure','A complete <html>…</html> document is required.');
  else ok('Document structure','Complete HTML document found.');
  if(size > 5*1024*1024) critical('File size','The standalone HTML exceeds the 5 MB V1 limit.');
  else ok('File size',fmtBytes(size)+' of 5 MB.');
  if(/\b(?:href|src)\s*=\s*["']\s*javascript:/i.test(html)) critical('Unsafe navigation','javascript: URLs are not allowed.');
  else ok('Unsafe navigation','No javascript: links found.');
  const external = (html.match(/\b(?:src|href)\s*=\s*["']https?:\/\//gi)||[]).length;
  if(external) warn('External dependencies',external+' remote resource'+(external===1?'':'s')+' may fail in a client environment.');
  else ok('External dependencies','The document is self-contained.');
  const scripts = (html.match(/<script\b/gi)||[]).length;
  if(scripts) warn('Active scripts',scripts+' script block'+(scripts===1?'':'s')+' will run inside a sandbox.');
  else ok('Active scripts','No script blocks found.');
  const forms = (html.match(/<form\b/gi)||[]).length;
  if(forms) warn('Form submission',forms+' form'+(forms===1?'':'s')+' detected; submissions are blocked in preview.');
  return {ready:!checks.some(c=>c.level==='error'),checks};
}
function validationMarkup(v){
  const val = v.validation || validateHtml(v.html,v.html.length);
  return '<div class="validation"><div class="vh">'+(val.ready?'Ready to preview and publish':'Publish blocked')+'</div>'
    + val.checks.map(c=>'<div class="vr"><span class="'+(c.level==='error'?'er':c.level==='warning'?'wa':'ok')+'">'+(c.level==='error'?'✕':c.level==='warning'?'!':'✓')+'</span>'
      + '<span><b style="color:#fff">'+esc(c.label)+'</b> — '+esc(c.detail)+'</span></div>').join('')+'</div>';
}
function toast(msg){
  clearTimeout(toastT);
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  toastT = setTimeout(()=>el.remove(), 2600);
}

/* ═══════════════ file handling ═══════════════ */
function readAsText(f){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsText(f); }); }
function readAsDataURL(f){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); }); }

async function ingest(fileList){
  const files = [...fileList];
  if(!files.length) return null;
  if(files.length!==1){ toast('V1 accepts one standalone HTML file per version'); return null; }
  const f = files[0];
  if(!/\.html?$/i.test(f.name)){ toast('Choose an .html file'); return null; }
  const html = await readAsText(f);
  return {
    files:[{path:f.name,size:f.size}],
    html,
    validation:validateHtml(html,f.size)
  };
}

function lookup(files, base, ref){
  const clean = ref.split('?')[0].split('#')[0].replace(/^\.\//,'');
  const cands = [base + clean, clean, clean.replace(/^\//,'')];
  for(const c of cands){
    const hit = files.find(f=>f.path === c || f.path.endsWith('/'+c));
    if(hit) return hit;
  }
  return null;
}

/* inline local css / js / images so a folder upload renders standalone */
function assemble(files, idx){
  let html = idx.data;
  const base = idx.path.includes('/') ? idx.path.slice(0, idx.path.lastIndexOf('/')+1) : '';
  html = html.replace(/<link\b[^>]*>/gi, m=>{
    if(!/stylesheet/i.test(m)) return m;
    const h = (m.match(/href=["']([^"']+)["']/i)||[])[1];
    if(!h) return m;
    const f = lookup(files, base, h);
    return (f && f.isText) ? '<style>\n'+f.data+'\n</style>' : m;
  });
  html = html.replace(/<script\b[^>]*src=["']([^"']+)["'][^>]*>\s*<\/script>/gi, (m, src)=>{
    const f = lookup(files, base, src);
    return (f && f.isText) ? '<script>\n'+f.data+'\n<\/script>' : m;
  });
  html = html.replace(/\b(src|href)=["']([^"']+)["']/gi, (m, attr, val)=>{
    if(/^(https?:|data:|blob:|#|mailto:|tel:|\/\/)/i.test(val)) return m;
    const f = lookup(files, base, val);
    if(!f || f.isText) return m;
    return attr+'="'+f.data+'"';
  });
  return html;
}

function stageBanner(a){
  if(S.role!=='consultant') return '';
  if(a.status==='published') return '<div class="hintbar">This is the <b>published</b> experience. Clients on '+(a.projects||[a.project]).map(esc).join(', ')+' see this. Use Manage only if you need to change it.</div>';
  if(a.status==='retracted') return '<div class="hintbar">This analysis is <b>retracted</b>. Clients no longer see a tile. Bookmarked links show a withdrawn notice.</div>';
  if(!a.versions.length) return '<div class="hintbar">This is a <b>draft with no HTML yet</b>. Clients cannot see it. Upload a version from Manage, or below.</div>';
  return '<div class="hintbar">This is a <b>draft</b>. You are looking at the analysis itself. Clients cannot see it until you publish.</div>';
}

function renderClientAnalysis(){

      + '<div class="wi">⤺</div><h1 class="pt sm">This analysis has been withdrawn</h1>'

function renderWorkflow(){

    + '<div class="story-grid">'
    + '<div class="story-card"><h4>Epic</h4><p><b>As an assigned Blue Ops Consultant,</b> I publish one immutable HTML analysis to the Diligent IQ projects I can access, so entitled clients can open the correct current version and nobody else can.</p><p style="margin:10px 0 0;font-size:12px;color:var(--muted)">Do not build this as one ticket. Split it on status change: shell → version → preview → publish → replace → retract. Empty discard is the only delete.</p></div>'
    + '<div class="story-card"><h4>Success measure</h4><p>The intended client can open the correct active version from Atlas Studio, while drafts, retracted analyses, management controls and projects outside their access remain unavailable.</p></div>'
    + '<div class="story-card"><h4>Happy-path journey</h4><ol>'
    + '<li>Open Atlas Studio in the current project.</li><li>See one grid of draft, published and retracted analyses.</li>'
    + '<li>Create an analysis with a name and client-facing description.</li><li>Keep the current project selected; optionally multi-select other accessible projects.</li>'
    + '<li>Drag or select one standalone HTML file.</li><li>Resolve critical validation errors; review warnings.</li>'
    + '<li>Preview the exact landing page and HTML as the client.</li><li>Review every target project and publish the selected version to all.</li>'
    + '<li>Open the same client-first experience; use Manage only when changes are needed.</li></ol></div>'
    + '<div class="story-card"><h4>Lifecycle</h4><ul>'
    + '<li><b>Draft:</b> internal only; may be previewed, never visible to clients.</li>'
    + '<li><b>Published:</b> one explicitly selected immutable version is active across all bound projects.</li>'
    + '<li><b>Replacement:</b> current version remains live while a new draft is uploaded; consultant explicitly activates the replacement.</li>'
    + '<li><b>Retracted:</b> tiles disappear; bookmarked links show a neutral withdrawn message; versions remain internally available.</li></ul></div>'
    + '<div class="story-card"><h4>V1 user stories</h4><ol>'
    + '<li><b>C1 Shelf.</b> Open Studio in the current project. See draft, published and retracted tiles; empty drafts labelled separately.</li>'
    + '<li><b>C2 Create shell.</b> Name, description, multi-project bind defaulting to current. Clients still see nothing.</li>'
    + '<li><b>C3 Open first.</b> Every tile click shows the analysis at its current stage. Manage is a second step.</li>'
    + '<li><b>C4 Upload version.</b> One standalone HTML file, blocking validation, immutable. Bindings lock.</li>'
    + '<li><b>C5 Preview.</b> Exact landing page and HTML. Does not publish.</li>'
    + '<li><b>C6 Publish + CL1.</b> One confirmed action to all bound projects. Client can open only that version.</li>'
    + '<li><b>C7 Replace.</b> New version stays draft until explicitly activated. History is kept.</li>'
    + '<li><b>C8 Retract.</b> Tiles leave the client shelf. Bookmarks show withdrawn. Versions remain internally.</li>'
    + '<li><b>C9 Discard empty.</b> Delete only a never-published draft with zero versions.</li></ol></div>'
    + '<div class="story-card"><h4>Acceptance criteria</h4><ul>'
    + '<li>Only assigned consultants can create or manage an analysis.</li>'
    + '<li>The project picker lists only projects the consultant can access and defaults to the current project.</li>'
    + '<li>Bindings lock after the first version is added.</li><li>Only one standalone .html file is accepted per version.</li>'
    + '<li>Critical validation errors block preview and publish; warnings remain visible.</li>'
    + '<li>Uploaded HTML is never editable in place.</li><li>Publishing enumerates every project and audience before confirmation.</li>'
    + '<li>Clients never see drafts, retracted tiles, source, version controls or Manage.</li>'
    + '<li>Published and draft tile clicks open the analysis experience first, not the management screen. Manage is a second step.</li></ul></div>'
    + '<div class="story-card"><h4>Alternate and error paths</h4><ul>'
    + '<li><b>Invalid file:</b> reject non-HTML, empty, incomplete, unsafe or oversized files with actionable errors.</li>'
    + '<li><b>External dependency:</b> warn that remote assets may fail in the client environment.</li>'
    + '<li><b>Wrong project:</b> change bindings before the first version; after that, create a separate analysis rather than silently moving client content.</li>'
    + '<li><b>Replacement rejected:</b> current active version remains untouched.</li>'
    + '<li><b>Retracted link:</b> show a neutral withdrawn page instead of a broken or stale analysis.</li></ul></div>'
    + '<div class="story-card"><h4>Permissions</h4><ul>'
    + '<li><b>Consultant:</b> view client experience, manage metadata, upload versions, select active version, publish and retract.</li>'
    + '<li><b>Client consumer:</b> view published landing page and active HTML only.</li>'
    + '<li><b>Ontario:</b> remains the source of project access and tab visibility; Atlas does not duplicate it.</li></ul></div>'
    + '<div class="story-card"><h4>Policy decisions pending verification</h4><ul>'
    + '<li><b>Publish permission:</b> prototype allows any consultant assigned to every selected project. Confirm whether a second person or Project Admin must approve.</li>'
    + '<li><b>Retraction in M&A:</b> prototype removes tiles and leaves a withdrawn notice. Confirm notification, audit and buyer-cascade rules before production.</li>'

    + '</div></div></div>';
}

function render(){
  renderChrome();
  document.getElementById('projSel').value = S.project;
  [...document.querySelectorAll('#roleSw button')].forEach(b=>b.classList.toggle('on', b.dataset.role===S.role));
  if(view.name==='workflow'){ renderWorkflow(); return; }
  if(S.role==='client'){
    if(view.name==='shelf') renderShelf(); else renderClientAnalysis();
    return;
  }
  if(view.name==='shelf') renderShelf();
  else if(view.name==='client') renderClientAnalysis();
  else if(view.name==='detail') renderDetail();
  else if(view.name==='overview') renderOverview();
  else if(view.name==='preview') renderPreview();
}

  showModal('<div class="modal"><div class="mh"><b>Retract from the client?</b><span class="x" data-act="close">×</span></div>'
  + '<p class="md">'+(a.openedBy>0? a.openedBy+' client opens are recorded. Retracting affects every bound project.' : 'Nobody has opened this yet. Retracting still affects every bound project.')+'</p>'
  + '<div class="conseq">'
  + a.projects.map(p=>'<div><span>'+esc(p)+'</span><span class="a">Tile removed</span></div>').join('')
  + '<div><span>The tile disappears from their tab</span><span class="a">Yes</span></div>'
  + '<div><span>Anyone holding the link sees</span><span class="w">"Withdrawn"</span></div>'
  + '<div><span>The version itself</span><span class="y">Kept, openable internally</span></div>'
  + '<div><span>Re-publish later</span><span class="y">Any time</span></div></div>'
  + '<div class="field"><div class="fl">REASON — RECORDED, NOT SHOWN TO THE CLIENT</div>'
  + '<input id="retReason" placeholder="e.g. restating wallet share; v2 to follow today"></div>'
  + '<div class="mfoot"><button class="btn txt" data-act="close">Cancel</button>'
  + '<button class="btn dgr" data-act="do-retract">Retract</button></div></div>');
}

/* ═══════════════ actions ═══════════════ */
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-act]');
  if(e.target.hasAttribute && e.target.hasAttribute('data-ovl')){ closeModal(); return; }
  if(!t) return;
  const act = t.dataset.act, a = cur();

  switch(act){
    case 'close': closeModal(); break;
    case 'reset': localStorage.removeItem(LS); S = seed(); view={name:'shelf'}; closeModal(); render(); toast('Demo reset'); break;
    case 'go-shelf': view={name:'shelf'}; render(); break;
    case 'workflow': closeModal(); view={name:'workflow'}; render(); break;

    case 'open': {
      const id = t.dataset.id;
      const an = S.analyses.find(x=>x.id===id);
      if(S.role==='client'){ an.openedBy = Math.min(an.totalUsers, (an.openedBy||0)+1); save(); }
      view = {name:'client', id, pane:'overview'};
      render(); break;
    }
    case 'manage': view={name:'detail',id:a.id}; render(); break;
    case 'discard': if(canDiscard(a)) mDiscard(); else toast('Only an empty, never-published draft can be discarded'); break;
    case 'do-discard': {
      if(!canDiscard(a)){ toast('This analysis can no longer be discarded'); break; }
      const name=a.name;
      S.analyses = S.analyses.filter(x=>x.id!==a.id);
      save(); closeModal(); view={name:'shelf'}; render(); toast('Discarded '+name); break;
    }
    case 'new-analysis': mNewAnalysis(); break;
    case 'create-analysis': {
      const name = document.getElementById('naName').value.trim();
      if(!name){ toast('Give it a name'); break; }
      const projects=[...document.querySelectorAll('input[name="naProjects"]:checked')].map(x=>x.value);
      if(!projects.length){ toast('Select at least one project'); break; }
      const id = 'a'+Date.now();
      S.analyses.push({ id, name, desc: document.getElementById('naDesc').value.trim(),
        project: projects[0], projects, status:'draft', versions:[], liveVersionId:null, selectedVersionId:null,
        overview:{basis:'',startHere:''}, totalUsers:10, openedBy:0, note:'', retractReason:'' });
      save(); closeModal(); view={name:'client', id, pane:'overview'};
      render(); toast('Created — now add a version');
      setTimeout(mNewVersion, 260); break;
    }
    case 'edit-metadata': mEditMetadata(); break;
    case 'save-metadata': {
      const name=document.getElementById('emName').value.trim();
      if(!name){ toast('Give it a name'); break; }
      a.name=name; a.desc=document.getElementById('emDesc').value.trim();
      if(!a.versions.length){
        const projects=[...document.querySelectorAll('input[name="emProjects"]:checked')].map(x=>x.value);
        if(!projects.length){ toast('Select at least one project'); break; }
        a.projects=projects; a.project=projects[0];
      }
      save(); closeModal(); render(); toast('Analysis details saved'); break;
    }

    case 'new-version': pending=null; mNewVersion(); break;
    case 'up-html': document.getElementById('fiHtml').click(); break;
    case 'clear-files': pending=null; setCount('no file selected'); {
      const vh=document.getElementById('nvValidation'); if(vh) vh.innerHTML='';
      const cb=document.getElementById('createVersionBtn');
      if(cb){ cb.className='btn dn'; cb.dataset.act='validation-blocked'; }
      break;
    }
    case 'validation-blocked': toast('Resolve critical validation errors first'); break;
    case 'create-version': {
      if(!pending || !pending.validation.ready){ toast('Choose a valid standalone HTML file'); break; }
      const html=pending.html, files=pending.files;
      const n = a.versions.length+1, id = 'v'+Date.now();
      a.versions.push({ id, n, files: files.map(f=>({path:f.path,size:f.size})), html, validation:pending.validation, createdAt: Date.now() });
      a.selectedVersionId = id;
      save(); closeModal();
      view = view.name==='client' ? {name:'client', id:a.id, pane:'overview'} : {name:'detail', id:a.id};
      render(); toast('v'+n+' created as a draft'); break;
    }
    case 'pick-version': a.selectedVersionId = t.dataset.vid; save(); render(); break;

    case 'go-overview': view={name:'overview', id:a.id}; render(); break;
    case 'save-overview': {
      a.overview.basis = document.getElementById('ovBasis').value.trim();
      a.overview.startHere = document.getElementById('ovStart').value.trim();
      save(); toast('Overview page saved'); break;
    }
    case 'go-preview': {
      if(!a.versions.length){ toast('Add a version first'); break; }
      const sv=a.versions.find(v=>v.id===a.selectedVersionId)||a.versions[a.versions.length-1];
      if(!sv.validation || !sv.validation.ready){ toast('Resolve critical validation errors before preview'); break; }
      view={name:'preview', id:a.id, pane:'overview', as:'client'}; render(); break;
    }
    case 'as-me': view.as='me'; render(); break;
    case 'as-client': view.as='client'; render(); break;
    case 'pane-overview': view.pane='overview'; render(); break;
    case 'pane-analysis': view.pane='analysis'; render(); break;

    case 'publish': {
      if(!a.versions.length){ toast('Add a version first'); break; }
      const sv=a.versions.find(v=>v.id===a.selectedVersionId)||a.versions[a.versions.length-1];
      if(!sv.validation || !sv.validation.ready){ toast('Resolve critical validation errors first'); break; }
      if(!a.overview.basis){ toast('Add the basis of presentation before publishing'); view={name:'overview',id:a.id}; render(); break; }
      mPublish(); break;
    }
    case 'do-publish': {
      a.liveVersionId = t.dataset.vid;
      a.status = 'published';
      a.note = (document.getElementById('pubNote')||{}).value || '';
      a.retractReason = '';
      save(); closeModal(); view={name:'detail', id:a.id}; render();
      toast('Published — switch to Client consumer above to see it'); break;
    }
    case 'replace': {
      const sv=a.versions.find(v=>v.id===a.selectedVersionId);
      if(!sv.validation || !sv.validation.ready){ toast('That version is not ready'); break; }
      a.liveVersionId = a.selectedVersionId; save(); render();
      toast('Live version replaced'); break;
    }
    case 'retract': mRetract(); break;
    case 'do-retract': {
      a.status = 'retracted';
      a.retractReason = (document.getElementById('retReason')||{}).value || '';
      save(); closeModal(); render(); toast('Retracted — the client tile is gone'); break;
    }
  }
});

function setCount(txt){ const el = document.getElementById('nvCount'); if(el) el.textContent = txt; }
async function handleFiles(fl){
  setCount('reading…');
  const res = await ingest(fl);
  if(!res){ setCount('no file selected'); return; }
  pending = res;
  setCount(res.files[0].path+' · '+fmtBytes(res.files[0].size));
  const vh=document.getElementById('nvValidation');
  if(vh) vh.innerHTML=validationMarkup({html:res.html,validation:res.validation});
  const cb=document.getElementById('createVersionBtn');
  if(cb){
    cb.className='btn '+(res.validation.ready?'':'dn');
    cb.dataset.act=res.validation.ready?'create-version':'validation-blocked';
  }
  toast(res.validation.ready?'Validation passed — ready to create draft':'Validation found blocking errors');
}
document.getElementById('fiHtml').addEventListener('change', ev=>{ if(ev.target.files.length) handleFiles(ev.target.files); ev.target.value=''; });
document.addEventListener('change',ev=>{
  if(ev.target.matches('input[name="naProjects"],input[name="emProjects"]')){
    const label=ev.target.closest('.project-pick'); if(label) label.classList.toggle('on',ev.target.checked);
  }
});
document.addEventListener('dragover',ev=>{
  const dz=document.getElementById('dropzone');
  if(dz){ ev.preventDefault(); dz.classList.add('over'); }
});
document.addEventListener('dragleave',ev=>{
  const dz=document.getElementById('dropzone'); if(dz) dz.classList.remove('over');
});
document.addEventListener('drop',ev=>{
  const dz=document.getElementById('dropzone');
  if(!dz) return;
  ev.preventDefault(); dz.classList.remove('over');
  if(ev.dataTransfer.files.length) handleFiles(ev.dataTransfer.files);
});

document.getElementById('projSel').innerHTML = PROJECTS.map(p=>'<option>'+p+'</option>').join('');
document.getElementById('projSel').addEventListener('change', ev=>{ S.project = ev.target.value; view={name:'shelf'}; save(); render(); });
document.getElementById('roleSw').addEventListener('click', ev=>{
  const b = ev.target.closest('button[data-role]'); if(!b) return;
  S.role = b.dataset.role; view={name:'shelf'}; save(); render();
});

load(); render();
</script>
